plugins {
    id 'com.android.application'
}

// Run on every build: the script rebuilds the sibling phi-spaces source and preserves unchanged assets.
def mobileRoot = rootProject.projectDir.parentFile
tasks.register('prepareMobileRuntime', Exec) {
    workingDir mobileRoot
    commandLine 'python3', new File(mobileRoot, 'scripts/prepare-runtime.py').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'prepareMobileRuntime' }

android {
    namespace 'org.pimobile.app'
    compileSdk 35

    defaultConfig {
        applicationId 'org.pimobile.app'
        minSdk 26
        // targetSdk 28 keeps direct exec() of app-private binaries working
        // (Android 10+ blocks exec in app home for targetSdk >= 29).
        // Sideload/F-Droid only; Play requires a higher targetSdk.
        targetSdk 28
        versionCode 8
        versionName '0.0.8'
    }

    // Optional native UI acceptance harness; excluded from ordinary debug/release APKs.
    if (project.hasProperty('spaceUiAcceptance')) {
        sourceSets.debug.java.srcDir 'test-support/java'
        sourceSets.debug.manifest.srcFile 'test-support/AndroidManifest.xml'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


}
