<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>pi mobile — clients</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="clients">
  <header>
    <div id="menubar"></div>
  </header>
  <main id="keys-page">
    <div class="section-hdr">SSH key (this device)</div>
    <div id="sshkey-box">
      <div class="card card-outline">
        <div class="card-row">
          <span id="sshkey-status" style="flex:1;font-size: 16px">…</span>
          <button id="sshkey-gen" class="hidden btn-primary" style="font-size: 16px;padding:6px 14px">generate</button>
        </div>
        <pre id="sshkey-pub" class="hidden" style="margin-top:10px"></pre>
      </div>
    </div>
    <div class="section-hdr">
      Remote hosts
      <button id="add-toggle" class="btn-primary">＋ add</button>
    </div>
    <div id="client-list"></div>
    <form id="add-form" class="hidden" style="padding:0 10px 16px">
      <input id="add-name"   placeholder="name (optional)"       autocomplete="off">
      <input id="add-target" placeholder="user@host[:port]"      autocomplete="off" required>
      <button type="submit" id="add-btn">add host</button>
    </form>
    <p id="msg" class="key-empty"></p>
  </main>
  <script type="module" src="clients.js"></script>
</body>
</html>
